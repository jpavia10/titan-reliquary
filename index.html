<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12100e" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Titan Reliquary</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23c9a227'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%231a1612'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='22' fill='%23e8c547'%3E₳%3C/text%3E%3C/svg%3E" />
  <style>
:root {
  --bg: #12100e;
  --bg2: #1a1612;
  --bg3: #241f19;
  --panel: #1e1a15;
  --border: #3a3228;
  --gold: #c9a227;
  --gold-soft: #e8c547;
  --gold-dim: #8a7020;
  --text: #e8e0d4;
  --muted: #9a8f7e;
  --ok: #6bbf7a;
  --warn: #d4a017;
  --danger: #c45c4a;
  --chip: #2a241c;
  --row-hover: #2c261e;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  --radius: 12px;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Code", "Consolas", "Menlo", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 20% -10%, rgba(201, 162, 39, 0.12), transparent 45%),
    radial-gradient(ellipse at 90% 10%, rgba(80, 60, 20, 0.2), transparent 40%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 1920px;
  margin: 0 auto;
  padding: 1rem 1.5rem 4.5rem;
  min-height: 100vh;
}
@media (min-width: 1400px) {
  #app { padding-left: 1.75rem; padding-right: 1.75rem; }
}

/* Header */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 0.85rem 1rem;
  padding: 0.75rem 0 1rem;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: flex-start; gap: 0.85rem; flex: 1 1 220px; min-width: 0; }
.brand h1 {
  margin: 0;
  font-size: 1.45rem;
  font-weight: 650;
  letter-spacing: 0.02em;
  color: var(--gold-soft);
}
.brand .sub { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; line-height: 1.35; }
.live-status {
  margin: 0.35rem 0 0;
  font-size: 0.75rem;
  color: var(--gold-dim);
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
}
.live-status .dot {
  display: inline-block;
  width: 0.45rem; height: 0.45rem;
  border-radius: 50%;
  background: var(--ok);
  margin-right: 0.35rem;
  vertical-align: middle;
  box-shadow: 0 0 6px rgba(107, 191, 122, 0.6);
}
.live-status.off .dot { background: var(--muted); box-shadow: none; }
.coin {
  font-size: 2rem;
  color: var(--gold);
  text-shadow: 0 0 18px rgba(201, 162, 39, 0.4);
  line-height: 1;
  margin-top: 0.1rem;
}
.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; flex: 2 1 280px; }
.chip {
  background: var(--chip);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.28rem 0.7rem;
  font-size: 0.8rem;
  color: var(--text);
  white-space: nowrap;
}
.chip strong { color: var(--gold-soft); font-weight: 600; }
.chip.ag strong { color: #c0c0c8; }
.chip.au strong { color: var(--gold-soft); }
.hdr-actions { display: flex; align-items: center; gap: 0.55rem; flex: 0 0 auto; }
.auto-toggle {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.75rem;
  color: var(--muted);
  background: var(--chip);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.3rem 0.65rem;
  cursor: pointer;
  user-select: none;
}
.auto-toggle input { accent-color: var(--gold); margin: 0; }
.auto-toggle:has(input:checked) { color: var(--gold-soft); border-color: var(--gold-dim); }
.badge.hold {
  background: linear-gradient(135deg, #3a2a12, #2a1e0c);
  border: 1px solid var(--gold-dim);
  color: var(--gold-soft);
  font-weight: 700;
  letter-spacing: 0.12em;
  font-size: 0.72rem;
  padding: 0.4rem 0.75rem;
  border-radius: 6px;
}

/* Tabs */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin: 0.85rem 0 1rem;
  padding: 0.25rem;
  background: var(--bg2);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.tab {
  appearance: none;
  border: none;
  background: transparent;
  color: var(--muted);
  padding: 0.55rem 0.95rem;
  border-radius: 8px;
  cursor: pointer;
  font: inherit;
  font-size: 0.9rem;
  font-weight: 550;
  transition: background 0.15s, color 0.15s;
}
.tab:hover { color: var(--text); background: var(--bg3); }
.tab.active {
  background: linear-gradient(180deg, #3a3020, #2a2418);
  color: var(--gold-soft);
  box-shadow: inset 0 0 0 1px var(--gold-dim);
}

/* Panes */
.pane { display: none; animation: fade 0.2s ease; }
.pane.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}
.grid.two { grid-template-columns: 1fr 1fr; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
  box-shadow: var(--shadow);
}
.card h3 {
  margin: 0 0 0.35rem;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
}
.card .val {
  font-size: 1.45rem;
  font-weight: 650;
  color: var(--gold-soft);
  font-variant-numeric: tabular-nums;
}
.card .hint { margin-top: 0.3rem; font-size: 0.8rem; color: var(--muted); }
.card.wide { grid-column: 1 / -1; }

.progress-wrap { margin: 0.5rem 0 0; }
.progress {
  height: 10px;
  background: var(--bg);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.progress > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold-soft));
  border-radius: 999px;
}
.bucket-row {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.45rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.92rem;
}
.bucket-row:last-child { border-bottom: none; }
.bucket-row .k { color: var(--muted); }
.bucket-row .v { font-variant-numeric: tabular-nums; color: var(--text); text-align: right; }

.moments { list-style: none; margin: 0; padding: 0; }
.moments li {
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
  color: var(--text);
  line-height: 1.45;
}
.moments li:last-child { border-bottom: none; }
.flags li { color: var(--warn); }

/* Latest adds */
.latest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 0.55rem;
  margin-top: 0.55rem;
}
.latest-card {
  appearance: none;
  display: block;
  width: 100%;
  text-align: left;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.7rem 0.8rem;
  color: inherit;
  cursor: pointer;
  font: inherit;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.3s;
}
.latest-card:hover {
  border-color: var(--gold-dim);
  background: var(--row-hover);
}
.latest-card .id {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--gold-soft);
  font-weight: 600;
}
.latest-card .ser {
  display: block;
  margin-top: 0.15rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--gold-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.latest-card .meta {
  margin-top: 0.35rem;
  font-size: 0.8rem;
  color: #d8d0c4;
  line-height: 1.35;
}
.latest-card .est {
  margin-top: 0.3rem;
  font-size: 0.78rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.latest-card.is-new,
tr.is-new {
  animation: pulse-new 2.8s ease;
  box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(232, 197, 71, 0.25);
  border-color: var(--gold);
}
@keyframes pulse-new {
  0% { box-shadow: 0 0 0 2px var(--gold-soft), 0 0 22px rgba(232, 197, 71, 0.45); }
  100% { box-shadow: none; }
}

/* Toolbar / filters */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
  align-items: center;
}
.toolbar input, .toolbar select {
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 0.5rem 0.7rem;
  font: inherit;
  font-size: 0.88rem;
  min-width: 0;
}
.toolbar input { flex: 1 1 200px; }
.toolbar select { flex: 0 1 150px; }
.toolbar .meta { color: var(--muted); font-size: 0.82rem; margin-left: auto; }

.country-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin: 0 0 0.75rem;
  max-height: 5.6rem;
  overflow: auto;
  padding-bottom: 0.15rem;
}
.country-chip {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--muted);
  border-radius: 999px;
  padding: 0.22rem 0.6rem;
  font: inherit;
  font-size: 0.75rem;
  cursor: pointer;
  white-space: nowrap;
}
.country-chip strong { color: var(--gold-soft); font-weight: 600; margin-left: 0.25rem; font-variant-numeric: tabular-nums; }
.country-chip:hover { color: var(--text); border-color: var(--gold-dim); }
.country-chip.active {
  color: var(--gold-soft);
  border-color: var(--gold-dim);
  background: #2a2418;
}

/* Tables */
.table-wrap {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  max-height: calc(100vh - 280px);
  -webkit-overflow-scrolling: touch;
}
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
  font-variant-numeric: tabular-nums;
}
table.data th {
  position: sticky;
  top: 0;
  background: #2a241c;
  color: var(--gold);
  text-align: left;
  padding: 0.65rem 0.75rem;
  font-weight: 600;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--border);
  z-index: 1;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
table.data th.sorted { color: var(--gold-soft); }
table.data td {
  padding: 0.55rem 0.75rem;
  border-bottom: 1px solid rgba(58, 50, 40, 0.6);
  vertical-align: top;
}
table.data tbody tr { cursor: pointer; transition: background 0.1s; }
table.data tbody tr:hover { background: var(--row-hover); }
table.data .num { text-align: right; }
table.data .muted { color: var(--muted); }
.ser { font-family: var(--mono); font-size: 0.8rem; color: var(--gold-dim); }

/* Drawer */
.backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 40;
}
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(1040px, 100vw);
  z-index: 50;
  pointer-events: none;
}
.drawer:not([hidden]) { pointer-events: auto; }
.drawer-inner {
  height: 100%;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 1.25rem 1.35rem 2rem;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
.drawer-close {
  float: right;
  appearance: none;
  border: none;
  background: var(--bg3);
  color: var(--text);
  width: 2rem; height: 2rem;
  border-radius: 8px;
  font-size: 1.3rem;
  cursor: pointer;
  line-height: 1;
}
.drawer-close:hover { background: var(--border); }
.drawer h2 {
  margin: 0 0 0.25rem;
  color: var(--gold-soft);
  font-size: 1.2rem;
  clear: both;
  padding-right: 2.5rem;
  line-height: 1.3;
}
.drawer .scan {
  font-family: var(--mono);
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 1rem;
}
.kv { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.4rem 0.75rem; font-size: 0.88rem; margin-bottom: 1rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.notes-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem;
  font-size: 0.88rem;
  line-height: 1.5;
  white-space: pre-wrap;
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 4.25rem;
  transform: translateX(-50%);
  z-index: 60;
  background: linear-gradient(180deg, #3a3020, #2a2418);
  border: 1px solid var(--gold-dim);
  color: var(--gold-soft);
  padding: 0.65rem 1.1rem;
  border-radius: 999px;
  font-size: 0.88rem;
  box-shadow: var(--shadow);
  max-width: min(92vw, 420px);
  text-align: center;
  animation: toast-in 0.25s ease;
}
.toast[hidden] { display: none; }
@keyframes toast-in {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

/* Footer */
.foot {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  padding: 0.55rem 1.25rem;
  padding-bottom: max(0.55rem, env(safe-area-inset-bottom));
  background: rgba(18, 16, 14, 0.92);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(8px);
  font-size: 0.78rem;
  color: var(--muted);
  z-index: 30;
}
.foot #foot-path {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.btn {
  appearance: none;
  border: 1px solid var(--gold-dim);
  background: var(--bg3);
  color: var(--gold-soft);
  border-radius: 8px;
  padding: 0.4rem 0.85rem;
  font: inherit;
  font-size: 0.82rem;
  cursor: pointer;
  flex: 0 0 auto;
  white-space: nowrap;
}
.btn:hover { background: #332a1c; }
.btn:disabled { opacity: 0.5; cursor: wait; }

.empty { color: var(--muted); padding: 2rem; text-align: center; }
.error { color: var(--danger); padding: 1rem; }

@media (max-width: 700px) {
  #app { padding: 0.75rem 0.85rem 4.75rem; max-width: 100%; }
  .brand h1 { font-size: 1.2rem; }
  .brand .sub { font-size: 0.78rem; }
  .grid.two { grid-template-columns: 1fr; }
  .table-wrap { max-height: calc(100vh - 340px); }
  table.data { font-size: 0.84rem; }
  .kv { grid-template-columns: 1fr; gap: 0.15rem 0; }
  .kv dt { margin-top: 0.35rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .tab { padding: 0.65rem 0.85rem; font-size: 0.88rem; min-height: 44px; }
  .country-chip { padding: 0.4rem 0.75rem; font-size: 0.8rem; min-height: 36px; }
  .btn, .auto-toggle { min-height: 44px; }
  .drawer-close { min-height: 44px; min-width: 44px; }
  .latest-grid { grid-template-columns: repeat(2, 1fr); }
  .latest-card { padding: 0.85rem 0.9rem; min-height: 96px; }
  table.data td, table.data th { padding: 0.65rem 0.7rem; }
  .toolbar input, .toolbar select { font-size: 16px; padding: 0.65rem 0.75rem; }
  .card .val { font-size: 1.25rem; }
  .foot { padding-left: 0.85rem; padding-right: 0.85rem; }
}

.badge-ag {
  display: inline-block;
  background: #2a3038;
  border: 1px solid #7a8a9a;
  color: #d0d6de;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
  vertical-align: middle;
  margin-left: 0.25rem;
}
.badge-ag.unk { border-color: var(--warn); color: var(--warn); }
.filter-ag.active {
  background: #2a3038;
  border-color: #7a8a9a;
  color: #e8eef4;
}
.asw-cell { font-variant-numeric: tabular-nums; color: #c0c8d0; font-size: 0.84rem; }


/* ===== Latest cards · SER primary + thumb ===== */
.latest-card { position: relative; }
.latest-card .id { font-size: 0.82rem; letter-spacing: 0.01em; }
.lc-thumb {
  float: right;
  width: 38px; height: 38px;
  border-radius: 50%;
  object-fit: cover;
  margin: -0.1rem -0.1rem 0.2rem 0.4rem;
  border: 1px solid var(--border);
  background: var(--bg);
}
.lc-thumb.lc-blank {
  display: inline-block;
  border: 1px dashed #4a4034;
  background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(201,162,39,0.06) 56%);
}

/* ===== Tables · SER primary ===== */
td.ser-primary {
  font-family: var(--mono);
  font-size: 0.84rem;
  color: var(--gold-soft);
  font-weight: 600;
  white-space: nowrap;
}
td.scan-sec { font-family: var(--mono); font-size: 0.76rem; }
.cam { color: var(--ok); font-size: 0.7rem; margin-left: 0.2rem; vertical-align: middle; }

/* ===== Dossier ===== */
body.drawer-open { overflow: hidden; }
.drawer-inner { padding: 0 1.5rem 2.5rem; }
.drawer-bar {
  position: sticky; top: 0; z-index: 3;
  display: flex; align-items: center; gap: 0.4rem;
  margin: 0 -1.5rem 0.75rem;
  padding: 0.7rem 1.5rem;
  background: rgba(26, 22, 18, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.drawer-bar .drawer-close { float: none; margin-left: auto; }
.nav-btn {
  appearance: none; border: 1px solid var(--border); background: var(--bg3);
  color: var(--gold-soft); width: 2.1rem; height: 2rem; border-radius: 8px;
  font-size: 1.25rem; line-height: 1; cursor: pointer;
}
.nav-btn:hover:not(:disabled) { border-color: var(--gold-dim); }
.nav-btn:disabled { opacity: 0.35; cursor: default; }
.drawer-pos { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 0.25rem; }

.ds-head { margin-bottom: 1rem; }
.ds-ser {
  font-family: var(--mono);
  font-size: 1.55rem;
  font-weight: 700;
  color: var(--gold-soft);
  letter-spacing: 0.02em;
  line-height: 1.15;
}
.ds-head h2 { margin: 0.25rem 0 0.15rem; font-size: 1.15rem; color: var(--text); padding-right: 0; clear: none; }
.ds-head .scan { margin-bottom: 0.6rem; }
.ds-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.6rem; }
.ds-complete { font-size: 0.74rem; color: var(--muted); display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.ds-complete .bar { width: 120px; height: 5px; border-radius: 99px; background: var(--bg3); overflow: hidden; display: inline-block; }
.ds-complete .bar span { display: block; height: 100%; background: var(--warn); }
.ds-complete.full .bar span { background: var(--ok); }
.badge-au, .badge-kind {
  display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
  padding: 0.1rem 0.4rem; border-radius: 4px; vertical-align: middle; margin-left: 0.25rem;
  font-family: var(--font);
}
.badge-au { background: #3a2e12; border: 1px solid var(--gold); color: var(--gold-soft); }
.badge-kind { background: var(--bg3); border: 1px solid var(--border); color: var(--muted); }
.ds-ser .badge-ag { font-size: 0.7rem; }

.ds-grid { display: grid; grid-template-columns: 1fr; gap: 1rem 1.5rem; }
@media (min-width: 900px) {
  .ds-grid { grid-template-columns: minmax(340px, 500px) 1fr; }
  .ds-col-photos { position: sticky; top: 3.8rem; align-self: start; }
  .ds-grid.no-photos { grid-template-columns: 1fr; }
}
.ds-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.ph-slot { margin: 0; }
.ph-slot figcaption {
  margin-top: 0.35rem; font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); text-align: center;
}
.ph-open {
  appearance: none; border: 1px solid var(--border); padding: 0; margin: 0;
  width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden;
  background: #0c0b0a; cursor: zoom-in; display: block;
}
.ph-open img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ph-open:hover { border-color: var(--gold-dim); }
.ph-empty {
  aspect-ratio: 1 / 1; width: 100%;
  border: 2px dashed #4a4034; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.35rem; padding: 0.75rem; text-align: center;
  background:
    radial-gradient(circle at 50% 42%, rgba(201,162,39,0.07), transparent 60%),
    repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,0.012) 14px 28px);
}
.ph-ring {
  width: 42%; aspect-ratio: 1 / 1; border-radius: 50%;
  border: 2px dashed var(--gold-dim); opacity: 0.55; margin-bottom: 0.35rem;
}
.ph-await { font-size: 0.8rem; color: var(--gold-soft); font-weight: 600; letter-spacing: 0.03em; }
.ph-file {
  font-family: var(--mono); font-size: 0.66rem; color: #d8d0c4; word-break: break-all;
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.15rem 0.4rem; cursor: copy; max-width: 100%;
}
.ph-dir { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); word-break: break-all; }
.ph-hint { font-size: 0.72rem; color: var(--muted); margin: 0.6rem 0 0; line-height: 1.4; }
.ph-hint code { font-family: var(--mono); color: var(--gold-dim); }

.ds-sec { margin-bottom: 1rem; }
.ds-sec h4 {
  margin: 0 0 0.45rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--gold-dim); border-bottom: 1px solid var(--border); padding-bottom: 0.3rem;
}
.ds-sec .kv { margin-bottom: 0; grid-template-columns: 8.5rem 1fr; }
.kv dd.mono { font-family: var(--mono); color: var(--gold-soft); }
.kv dd.num { font-variant-numeric: tabular-nums; }
.kv dd.missing, .notes-box.missing { color: #5f574b; }

/* ===== Lightbox ===== */
.lightbox {
  position: fixed; inset: 0; z-index: 80;
  background: rgba(6, 5, 4, 0.94);
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
}
.lightbox[hidden] { display: none; }
.lb-fig { margin: 0; max-width: min(92vw, 1100px); max-height: 90vh; display: flex; flex-direction: column; align-items: center; }
.lb-fig img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 10px; box-shadow: var(--shadow); }
.lb-fig figcaption { margin-top: 0.6rem; color: var(--muted); font-size: 0.85rem; text-align: center; }
.lb-close, .lb-nav {
  position: absolute; appearance: none; border: 1px solid var(--border);
  background: rgba(36, 31, 25, 0.85); color: var(--gold-soft); cursor: pointer;
  border-radius: 10px; font-size: 1.6rem; line-height: 1; width: 2.8rem; height: 2.8rem;
}
.lb-close { top: 1rem; right: 1rem; }
.lb-prev { left: 1rem; top: 50%; transform: translateY(-50%); }
.lb-next { right: 1rem; top: 50%; transform: translateY(-50%); }
.lb-nav[hidden] { display: none; }

@media (max-width: 700px) {
  .drawer-inner { padding: 0 0.95rem 2.5rem; }
  .drawer-bar { margin: 0 -0.95rem 0.6rem; padding: 0.55rem 0.95rem; }
  .nav-btn { width: 44px; height: 44px; }
  .ds-ser { font-size: 1.3rem; }
  .ds-sec .kv { grid-template-columns: 6.6rem 1fr; gap: 0.35rem 0.6rem; }
  .ds-sec .kv dt { margin-top: 0; font-size: 0.8rem; text-transform: none; letter-spacing: 0; }
  .ds-complete .bar { width: 80px; }
  .lc-thumb { width: 30px; height: 30px; }
}

/* Titan Reliquary — vanilla vault GUI (Desktop folder app · GitHub Pages · single-file fallback) */
(() => {
  "use strict";

  const STATE_KEY = "tr_ui_state_v1";
  const SEEN_KEY = "tr_seen_flips_v1";
  const AUTO_KEY = "tr_auto_refresh_v1";
  const REFRESH_MS_FILE = 25000;
  const REFRESH_MS_WEB = 30000;
  const isHttp = /^https?:$/i.test(location.protocol);

  let vault = null;
  let flipSort = { key: "scan", dir: -1 }; // newest first by default
  let flipFilter = { q: "", country: "", year: "", silverOnly: false };
  let currentDrawerScan = null;
  let autoRefresh = true;
  let loadedAt = Date.now();
  let lastCheckAt = Date.now();
  let typingPauseUntil = 0;
  let drawerScrollPauseUntil = 0;
  let statusTimer = null;
  let reloadTimer = null;
  let toastTimer = null;
  let highlightScans = new Set();
  let restoring = false;

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

  function money(n) {
    if (n == null || Number.isNaN(Number(n))) return "—";
    return "$" + Number(n).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }
  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function num(n, d = 2, minD) {
    if (n == null || Number.isNaN(Number(n))) return "—";
    const max = d;
    const min = minD != null ? minD : d;
    return Number(n).toLocaleString("en-US", {
      minimumFractionDigits: min,
      maximumFractionDigits: max,
    });
  }
  function intFmt(n) {
    if (n == null || Number.isNaN(Number(n))) return "—";
    return Number(n).toLocaleString("en-US");
  }
  /** High-precision fixed decimals without thousands separators (years / ages). */
  function precise(n, d = 6) {
    if (n == null || Number.isNaN(Number(n))) return "—";
    return Number(n).toFixed(d);
  }

  function aswFmt(oz) {
    if (oz == null || Number.isNaN(Number(oz))) return "ASW unknown";
    return num(oz, 4) + " oz";
  }
  function meltLive(f) {
    if (f.melt_live != null) return money(f.melt_live);
    const spot = vault.precious?.spot_ag ?? vault.metals?.spot?.ag_usd_oz;
    if (f.asw_oz != null && spot != null) return money(Number(f.asw_oz) * Number(spot));
    return "—";
  }

  function scanNum(scan) {
    const m = String(scan || "").match(/(\d+)/);
    return m ? parseInt(m[1], 10) : -1;
  }
  function formatPT(isoOrPt) {
    if (!isoOrPt) return "—";
    if (/PT\s*$/i.test(String(isoOrPt)) || /\d{4}-\d{2}-\d{2} \d{2}:\d{2} PT/.test(String(isoOrPt))) {
      return String(isoOrPt);
    }
    try {
      const d = new Date(isoOrPt);
      if (Number.isNaN(d.getTime())) return String(isoOrPt);
      return d.toLocaleString("en-US", {
        timeZone: "America/Los_Angeles",
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
      }) + " PT";
    } catch {
      return String(isoOrPt);
    }
  }
  function snapshotLabel() {
    return vault?.generated_at_pt || formatPT(vault?.generated_at_iso || vault?.generated_at);
  }

  function saveState() {
    try {
      const active = $(".tab.active");
      const state = {
        tab: active?.dataset.tab || "board",
        flipQ: flipFilter.q,
        flipCountry: flipFilter.country,
        flipYear: flipFilter.year,
        silverOnly: !!flipFilter.silverOnly,
        flipSort,
        drawerScan: currentDrawerScan,
        scrollY: window.scrollY,
        drawerScroll: $("#drawer-inner")?.scrollTop || 0,
        autoRefresh,
        hash: location.hash,
      };
      sessionStorage.setItem(STATE_KEY, JSON.stringify(state));
    } catch { /* ignore */ }
  }

  function readState() {
    try {
      return JSON.parse(sessionStorage.getItem(STATE_KEY) || "null");
    } catch {
      return null;
    }
  }

  function applyHashTab() {
    const h = (location.hash || "").replace(/^#/, "");
    // Deep link: #coin=EU-CH-008 or #coin=C001 opens that dossier
    const cm = h.match(/^coin=(.+)$/i);
    if (cm && vault) {
      const key = decodeURIComponent(cm[1]).toUpperCase();
      const pools = [vault.flips, vault.bullion, vault.sets, vault.housing, vault.stamps];
      for (const pool of pools) {
        const hit = (pool || []).find((c) => String(c.ser || "").toUpperCase() === key || String(c.scan || "").toUpperCase() === key);
        if (hit) { setTab(hit.kind === "flip" || hit.kind === "token" ? "flips" : "bullion", false); openDrawer(hit.scan, false); break; }
      }
      return;
    }
    if (h && $(`.tab[data-tab="${h}"]`)) setTab(h, false);
  }

  function setTab(name, pushHash = true) {
    $$(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
    $$(".pane").forEach((p) => p.classList.toggle("active", p.id === "pane-" + name));
    if (pushHash) {
      const next = "#" + name;
      if (location.hash !== next) history.replaceState(null, "", next);
    }
    saveState();
  }

  function showToast(msg) {
    const el = $("#toast");
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 4500);
  }

  function detectNewFlips() {
    const flips = vault.flips || [];
    const count = flips.length;
    const newest = [...flips].sort((a, b) => scanNum(b.scan) - scanNum(a.scan))[0];
    const newestId = newest?.scan || null;
    let prev = null;
    try { prev = JSON.parse(localStorage.getItem(SEEN_KEY) || "null"); } catch { prev = null; }

    highlightScans = new Set();
    if (prev && typeof prev.count === "number" && newestId) {
      if (count > prev.count || (prev.newestId && scanNum(newestId) > scanNum(prev.newestId))) {
        const prevMax = scanNum(prev.newestId);
        const fresh = flips
          .filter((f) => scanNum(f.scan) > prevMax)
          .sort((a, b) => scanNum(b.scan) - scanNum(a.scan));
        fresh.forEach((f) => highlightScans.add(f.scan));
        if (fresh.length) {
          const top = fresh[0];
          const denom = top.denom || top.label || "";
          const label = `New: ${top.ser || top.scan} ${top.country || ""} ${denom} (${top.scan})`.replace(/\s+/g, " ").trim();
          showToast(fresh.length > 1 ? `${label} (+${fresh.length - 1} more)` : label);
        }
      }
    }
    try {
      localStorage.setItem(SEEN_KEY, JSON.stringify({ count, newestId, at: Date.now() }));
    } catch { /* ignore */ }
  }

  function isPaused() {
    return (
      Date.now() < typingPauseUntil ||
      Date.now() < drawerScrollPauseUntil ||
      !$("#lightbox")?.hidden ||
      ["flip-q", "flip-year"].includes(document.activeElement?.id)
    );
  }

  function markTyping() {
    typingPauseUntil = Date.now() + 8000;
  }

  function updateLiveStatus() {
    const el = $("#live-status");
    if (!el) return;
    const secs = Math.max(0, Math.floor((Date.now() - lastCheckAt) / 1000));
    const paused = isPaused();
    el.classList.toggle("off", !autoRefresh);
    const pauseNote = autoRefresh && paused ? " · paused" : "";
    const mode = isHttp
      ? "Phone/web · checks for a new publish every 30s, reloads only when it changes"
      : "Desktop live · reloads from disk every 25s";
    el.title = isHttp
      ? "Pull-only: polls version.json (no-store) ~30s; reloads with ?v= only when the build stamp changes"
      : "file:// hard reload ~25s; keeps tab, filters, open dossier and scroll; pauses while typing or scrolling the dossier";
    el.innerHTML = autoRefresh
      ? `<span class="dot"></span>${esc(mode)} · built ${esc(snapshotLabel())} · checked ${secs}s ago${pauseNote}`
      : `<span class="dot"></span>Auto off · built ${esc(snapshotLabel())} · checked ${secs}s ago · ${esc(isHttp ? "Phone/web" : "Desktop")}`;
  }

  let reloadAccum = 0;
  let webCheckInFlight = false;

  function bustReload() {
    saveState();
    if (isHttp) {
      const url = new URL(location.href);
      url.searchParams.set("v", Date.now().toString(36));
      location.replace(url.pathname + url.search + (url.hash || location.hash || ""));
    } else {
      location.reload();
    }
  }

  async function checkWebVersion() {
    if (webCheckInFlight) return;
    webCheckInFlight = true;
    try {
      const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      lastCheckAt = Date.now();
      if (!r.ok) return;
      const ver = await r.json();
      const current = vault && (vault.generated_at || vault.generated_at_pt || "");
      const remote = ver.generated_at || ver.generated_at_pt || "";
      if (remote && current && remote !== current) {
        bustReload();
      }
    } catch (_e) {
      lastCheckAt = Date.now();
    } finally {
      webCheckInFlight = false;
      updateLiveStatus();
    }
  }

  function scheduleReload() {
    clearInterval(reloadTimer);
    reloadAccum = 0;
    const intervalMs = isHttp ? REFRESH_MS_WEB : REFRESH_MS_FILE;
    reloadTimer = setInterval(() => {
      updateLiveStatus();
      if (!autoRefresh) {
        reloadAccum = 0;
        return;
      }
      if (isPaused()) return;
      if (isHttp && document.hidden) return; // phone asleep / tab in background: skip polls
      reloadAccum += 1000;
      if (reloadAccum >= intervalMs) {
        reloadAccum = 0;
        if (isHttp) checkWebVersion();
        else {
          saveState();
          location.reload();
        }
      }
    }, 1000);
  }

  async function loadVault() {
    const btn = $("#btn-refresh");
    if (btn) btn.disabled = true;
    try {
      const embedded = $("#vault-data");
      if (embedded) {
        vault = JSON.parse(embedded.textContent || "{}");
      } else {
        const r = await fetch("/api/vault", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        vault = await r.json();
      }
      loadedAt = Date.now();
      lastCheckAt = Date.now();
      detectNewFlips();
      renderAll();
      restoreUi();
    } catch (e) {
      $("#pane-board").innerHTML = `<p class="error">Failed to load vault: ${esc(e.message)}</p>`;
    } finally {
      if (btn) btn.disabled = false;
      updateLiveStatus();
    }
  }

  function restoreUi() {
    restoring = true;
    const st = readState();
    if (st) {
      flipFilter.q = st.flipQ || "";
      flipFilter.country = st.flipCountry || "";
      flipFilter.year = st.flipYear || "";
      flipFilter.silverOnly = !!st.silverOnly;
      if (st.flipSort) flipSort = st.flipSort;
      if (typeof st.autoRefresh === "boolean") {
        autoRefresh = st.autoRefresh;
        const box = $("#auto-refresh");
        if (box) box.checked = autoRefresh;
      }
      if (st.tab) setTab(st.tab, false);
      // Re-render flips with restored filters
      renderFlips();
      if (st.drawerScan) {
        openDrawer(st.drawerScan, false);
        requestAnimationFrame(() => {
          const inner = $("#drawer-inner");
          if (inner && st.drawerScroll) inner.scrollTop = st.drawerScroll;
        });
      }
      requestAnimationFrame(() => {
        if (typeof st.scrollY === "number") window.scrollTo(0, st.scrollY);
      });
    } else {
      applyHashTab();
    }
    if (st && /^#coin=/i.test(location.hash)) applyHashTab();
    // localStorage auto preference wins over default if set
    try {
      const savedAuto = localStorage.getItem(AUTO_KEY);
      if (savedAuto != null) {
        autoRefresh = savedAuto === "1";
        const box = $("#auto-refresh");
        if (box) box.checked = autoRefresh;
      }
    } catch { /* ignore */ }
    restoring = false;
    updateLiveStatus();
  }

  function renderAll() {
    renderHeader();
    renderBoard();
    renderFlips();
    renderBullion();
    renderWorld();
    renderOps();
    renderAge();
    const embedded = $("#vault-data");
    const refresh = $("#btn-refresh");
    if (embedded) {
      $("#foot-path").textContent = isHttp
        ? "Snapshot · " + snapshotLabel() + " · GitHub Pages · pull-only (version.json)"
        : "Snapshot · " + snapshotLabel() + " · Desktop folder app · live reload";
      if (refresh) {
        refresh.textContent = "↻ Refresh";
        refresh.title = isHttp
          ? "Check for a newer published snapshot and reload"
          : "Reload this file from disk (picks up a newly copied HTML)";
      }
    } else {
      $("#foot-path").textContent =
        (vault.root || "vault") + " · " + (vault.ledger_version || "") + " · gen " + snapshotLabel();
      if (refresh) {
        refresh.textContent = "↻ Refresh";
        refresh.title = "Reload vault data from the server";
      }
    }
  }

  function renderHeader() {
    const b = vault.board || {};
    const m = vault.metals || {};
    const spot = m.spot || {};
    const ag = spot.ag_usd_oz ?? b.spot_ag ?? b.silver?.spot;
    const au = spot.au_usd_oz ?? b.spot_au ?? b.gold?.spot;
    $("#hdr-sub").textContent =
      `${vault.ledger_version || "—"} · ${intFmt(b.vault ?? vault.counts?.vault)} pieces · grand ${money(b.grand)} · ${intFmt(vault.counts?.flips)} flips · ${intFmt(vault.counts?.countries)} countries`;
    $("#hdr-chips").innerHTML = `
      <span class="chip"><strong>${esc(intFmt(b.vault ?? "—"))}</strong> vault</span>
      <span class="chip"><strong>${money(b.grand)}</strong> grand</span>
      <span class="chip ag">Ag <strong>${ag != null ? money(ag) : "—"}</strong></span>
      <span class="chip au">Au <strong>${au != null ? money(au) : "—"}</strong></span>
    `;
  }

  function latestFlips(n = 10) {
    return [...(vault.flips || [])]
      .sort((a, b) => scanNum(b.scan) - scanNum(a.scan))
      .slice(0, n);
  }

  function splitFlags(flags) {
    const out = [];
    const seen = new Set();
    const norm = (s) => s.toLowerCase().replace(/^cull watch:\s*/i, "").replace(/\s+/g, " ").trim();
    for (const raw of flags || []) {
      const parts = String(raw).split(/\s*·\s*/).map((s) => s.trim()).filter(Boolean);
      const chunks = parts.length >= 2 && String(raw).length > 80 ? parts : [String(raw).trim()];
      for (const c of chunks) {
        if (!c) continue;
        const key = norm(c);
        if (!key || seen.has(key)) continue;
        // Skip if an existing flag already covers this text (or vice versa)
        let covered = false;
        for (const s of seen) {
          if (s.includes(key) || key.includes(s)) { covered = true; break; }
        }
        if (covered) continue;
        seen.add(key);
        out.push(c);
      }
    }
    return out;
  }

  function flipCountries() {
    const counts = new Map();
    (vault.flips || []).forEach((f) => {
      if (!f.country) return;
      counts.set(f.country, (counts.get(f.country) || 0) + 1);
    });
    return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  }

  function filteredFlips() {
    let rows = vault.flips || [];
    const q = flipFilter.q.trim().toLowerCase();
    if (flipFilter.silverOnly) rows = rows.filter((f) => f.is_silver);
    if (flipFilter.country) rows = rows.filter((f) => f.country === flipFilter.country);
    if (flipFilter.year) {
      const y = flipFilter.year.trim();
      rows = rows.filter((f) => String(f.year || "").includes(y));
    }
    if (q) {
      rows = rows.filter((f) => {
        const scan = String(f.scan || "").toLowerCase();
        const ser = String(f.ser || "").toLowerCase();
        // Allow C272 / c272 / 272 style
        const qNorm = q.replace(/^#/, "");
        if (scan.includes(qNorm) || ser.includes(qNorm)) return true;
        if (/^c?\d+$/i.test(qNorm) && scan.replace(/\D/g, "").includes(qNorm.replace(/\D/g, ""))) return true;
        const blob = [f.scan, f.ser, f.country, f.year, f.denom, f.label, f.notes, f.iso, f.metal]
          .join(" ")
          .toLowerCase();
        return blob.includes(q);
      });
    }
    const { key, dir } = flipSort;
    rows = [...rows].sort((a, b) => {
      if (key === "scan" || key === "newest") {
        return (scanNum(a.scan) - scanNum(b.scan)) * (key === "newest" ? -1 * Math.sign(dir || 1) : dir);
      }
      if (key === "est" || key === "value") {
        const va = a.est ?? -1, vb = b.est ?? -1;
        return (va - vb) * dir;
      }
      if (key === "asw" || key === "asw_oz") {
        const va = a.asw_oz ?? -1, vb = b.asw_oz ?? -1;
        return (va - vb) * dir;
      }
      if (key === "year") {
        const ya = parseInt(String(a.year || "").replace(/\D/g, ""), 10) || 0;
        const yb = parseInt(String(b.year || "").replace(/\D/g, ""), 10) || 0;
        return (ya - yb) * dir;
      }
      const va = String(a[key] ?? "").toLowerCase();
      const vb = String(b[key] ?? "").toLowerCase();
      return va.localeCompare(vb, undefined, { numeric: true }) * dir;
    });
    return rows;
  }

        <div class="card"><h3>Metals as-of</h3><div class="val" style="font-size:1rem">${esc(m.as_of_local || m.as_of || d.metals_live || "—")}</div>
          <div class="hint">Ag ${money(m.spot?.ag_usd_oz)} · Au ${money(m.spot?.au_usd_oz)}</div></div>
        <div class="card"><h3>Cull watch</h3><div class="hint" style="color:var(--warn);font-size:0.9rem;margin:0">${esc(d.cull_watch || "—")}</div></div>
      </div>
      <div class="grid two">
        <div class="card"><h3>Next IDs</h3>${idRows || '<p class="empty">—</p>'}</div>
        <div class="card"><h3>Open flags</h3><ul class="moments flags">${flags || "<li>—</li>"}</ul></div>
      </div>
      <div class="card" style="margin-top:0.75rem">
        <h3>Next SER by country</h3>
        <div class="table-wrap" style="max-height:360px;margin-top:0.5rem">
          <table class="data">
            <thead><tr><th>ISO</th><th>Country</th><th>Cont</th><th class="num">Count</th><th>Next</th></tr></thead>
            <tbody>${ser || '<tr><td colspan="5" class="empty">—</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderAge() {
    const age = vault.age || {};
    const fo = age.flips_other || {};
    const al = age.albums || {};
    const glance = vault.albums_glance || [];
    const glanceBody = glance
      .map((g) => `<tr><td>${esc(g.family)}</td><td class="muted">${esc(g.ids)}</td><td class="num">${esc(intFmt(g.coins))}</td><td class="num">${money(g.total)}</td><td class="muted">${esc(g.pulse)}</td></tr>`)
      .join("");

    $("#pane-age").innerHTML = `
      <div class="grid two">
        <div class="card">
          <h3>Flips + other</h3>
          <div class="bucket-row"><span class="k">Dated</span><span class="v">${esc(intFmt(fo.n_dated ?? "—"))}</span></div>
          <div class="bucket-row"><span class="k">ND excluded</span><span class="v">${esc(intFmt(fo.n_ND_excluded ?? "—"))}</span></div>
          <div class="bucket-row"><span class="k">Mean year</span><span class="v">${precise(fo.mean_year)}</span></div>
          <div class="bucket-row"><span class="k">Mean age</span><span class="v">${precise(fo.mean_age)} yrs</span></div>
          <div class="bucket-row"><span class="k">Oldest → newest</span><span class="v">${esc(String(fo.oldest ?? "—"))} → ${esc(String(fo.newest ?? "—"))}</span></div>
        </div>
        <div class="card">
          <h3>Albums (separate)</h3>
          <div class="bucket-row"><span class="k">Dated / total</span><span class="v">${esc(intFmt(al.n_dated_known ?? al.n_dated ?? "—"))} / ${esc(intFmt(al.n_total_album_coins ?? "—"))}</span></div>
          <div class="bucket-row"><span class="k">Coverage</span><span class="v">${al.coverage_pct != null ? num(al.coverage_pct, 1) + "%" : "—"}</span></div>
          <div class="bucket-row"><span class="k">Mean year</span><span class="v">${precise(al.mean_year)}</span></div>
          <div class="bucket-row"><span class="k">Mean age</span><span class="v">${precise(al.mean_age)} yrs</span></div>
          <div class="bucket-row"><span class="k">Oldest → newest</span><span class="v">${esc(String(al.oldest ?? "—"))} → ${esc(String(al.newest ?? "—"))}</span></div>
          <div class="hint" style="margin-top:0.5rem">As of ${esc(age.as_of || "—")} · ref ${esc(String(age.reference_year ?? ""))}</div>
        </div>
      </div>
      <div class="card" style="margin-top:0.75rem">
        <h3>Albums at a glance</h3>
        <div class="table-wrap" style="max-height:420px;margin-top:0.5rem">
          <table class="data">
            <thead><tr><th>Family</th><th>IDs</th><th class="num">Coins</th><th class="num">Total</th><th>Pulse</th></tr></thead>
            <tbody>${glanceBody || '<tr><td colspan="5" class="empty">—</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function findCard(scan) {
    const pools = [vault.flips, vault.bullion, vault.sets, vault.housing, vault.stamps];
    for (const pool of pools) {
      const hit = (pool || []).find((c) => c.scan === scan);
      if (hit) return hit;
    }
    return null;
  }

  const SER_SCHEMA = [
    ["ser", "SER"], ["scan", "Scan"], ["added", "Added"], ["cat", "Cat"],
    ["continent", "Continent"], ["country", "Country"], ["iso", "ISO"],
    ["year", "Year"], ["mint", "Mint"], ["denom", "Denom"], ["refs", "Refs"],
    ["metal", "Metal / cond"], ["specs", "Specs"], ["mintage", "Mintage"],
    ["design", "Design"], ["tender", "Tender"], ["qty", "Qty"], ["face", "Face"],
    ["est", "Est"], ["conf", "Conf"], ["label", "Label"], ["photo", "Photo"],
    ["parked", "Parked"], ["notes", "Notes"],
  ];
  const has = (v) => v != null && String(v).trim() !== "";

  function dossierList() {
    // Navigate in the order the user is looking at: filtered Flips list, else newest-first.
    const rows = filteredFlips();
    const pool = rows.length ? rows : latestFlips(1e6);
    return pool.map((f) => f.scan);
  }

  function photoSlot(c, side) {
    const path = side === "obv" ? c.photo_obv : c.photo_rev;
    const target = side === "obv" ? c.photo_target_obv : c.photo_target_rev;
    const label = side === "obv" ? "Obverse · front" : "Reverse · back";
    const file = target ? target.split("/").pop() : "";
    const dir = target ? target.slice(0, target.length - file.length) : "";
    const empty = `
      <div class="ph-empty">
        <span class="ph-ring" aria-hidden="true"></span>
        <span class="ph-await">Awaiting photo</span>
        ${file ? `<code class="ph-file" title="Click to copy file name" data-copy="${esc(file)}">${esc(file)}</code>
        <span class="ph-dir">${esc(dir)}</span>` : `<span class="ph-dir">No SER, so no photo target</span>`}
      </div>`;
    if (path) {
      return `
      <figure class="ph-slot has" data-side="${side}">
        <button type="button" class="ph-open" data-src="${esc(path)}" data-side="${side}" aria-label="Open ${esc(label)} full size">
          <img loading="lazy" src="${esc(path)}" alt="${esc((c.ser || c.scan) + " " + label)}" />
        </button>
        <div class="ph-fallback" hidden>${empty}</div>
        <figcaption>${esc(label)}</figcaption>
      </figure>`;
    }
    return `
      <figure class="ph-slot ph-blank" data-side="${side}">
        ${empty}
        <figcaption>${esc(label)}</figcaption>
      </figure>`;
  }

  function kvRows(rows) {
    return rows
      .map(([k, v, cls]) => `<dt>${esc(k)}</dt><dd class="${cls || ""}${has(v) ? "" : " missing"}">${has(v) ? esc(v) : "—"}</dd>`)
      .join("");
  }

  function openDrawer(scan, persist = true) {
    const c = findCard(scan);
    if (!c) return;
    currentDrawerScan = scan;
    const isFlip = c.kind === "flip" || c.kind === "token";
    const spotAg = vault.precious?.spot_ag ?? vault.metals?.spot?.ag_usd_oz;
    const spotAu = vault.precious?.spot_au ?? vault.metals?.spot?.au_usd_oz;
    const aswDisplay = c.is_silver
      ? (c.asw_oz != null ? aswFmt(c.asw_oz) : "ASW unknown")
      : (c.asw_oz != null ? aswFmt(c.asw_oz) : c.asw);
    const meltLiveDisplay = c.is_silver ? meltLive(c) : null;
    const photoStatus = c.has_photo
      ? [c.photo_obv ? "obv ✓" : "obv missing", c.photo_rev ? "rev ✓" : "rev missing"].join(" · ")
      : (c.photo || (c.photo_target_obv ? "pending pro rescan" : ""));

    const identity = [
      ["SER", c.ser, "mono"], ["Scan", c.scan ? `${c.scan}${c.scan_note && /renumber/i.test(c.scan_note) ? " · temporary" : ""}` : "", "mono"],
      ["Country", c.country], ["ISO", c.iso, "mono"], ["Continent", c.continent],
      ["Year", c.year], ["Mint", c.mint], ["Denom", c.denom], ["Cat", c.cat || c.kind], ["Label", c.label],
    ];
    const physical = [
      ["Metal / cond", c.metal], ["Specs", c.specs], ["Mintage", c.mintage],
      ["Design", c.design], ["Refs", c.refs], ["Tender", c.tender],
    ];
    const value = [
      ["Face", c.face], ["Est", c.est != null ? money(c.est) : c.est_raw, "num"], ["Conf", c.conf],
    ];
    if (c.melt != null || has(c.melt_raw) || c.is_silver || c.is_gold) {
      value.push(["Melt (card)", c.melt != null ? money(c.melt) : c.melt_raw, "num"]);
    }
    if (c.is_silver || c.asw_oz != null) {
      value.push(["Ag ASW", aswDisplay, "num"]);
      value.push(["Melt @ live", meltLiveDisplay ? `${meltLiveDisplay}${spotAg != null ? " @ " + money(spotAg) + "/oz" : ""}` : "", "num"]);
      if (c.asw_source) value.push(["ASW source", c.asw_source]);
    }
    if (c.is_gold || c.agw_oz != null) {
      value.push(["Au AGW", c.agw_oz != null ? num(c.agw_oz, 4) + " oz" : "AGW unknown", "num"]);
      value.push(["Melt Au @ live", c.melt_live_au != null ? `${money(c.melt_live_au)} @ ${money(spotAu)}/oz` : "", "num"]);
    }
    const record = [
      ["Qty", c.qty], ["Added", c.added], ["Parked", c.parked], ["Photo", photoStatus],
      ["Contents", c.contents],
    ].filter(([k, v]) => k !== "Contents" || has(v));

    // Non-flip cards: only show what exists (no SER schema).
    const clean = (rows) => (isFlip ? rows : rows.filter(([, v]) => has(v)));
    const section = (title, rows) => {
      const r = clean(rows);
      return r.length ? `<section class="ds-sec"><h4>${esc(title)}</h4><dl class="kv">${kvRows(r)}</dl></section>` : "";
    };

    const present = SER_SCHEMA.filter(([k]) => has(c[k]) || (k === "est" && c.est != null));
    const missing = SER_SCHEMA.filter(([k]) => !(has(c[k]) || (k === "est" && c.est != null))).map(([, l]) => l);
    const completeness = isFlip
      ? `<div class="ds-complete${missing.length ? "" : " full"}" title="${esc(missing.length ? "Missing: " + missing.join(", ") : "All SER fields present")}">
          <span class="bar"><span style="width:${Math.round((present.length / SER_SCHEMA.length) * 100)}%"></span></span>
          SER fields ${present.length}/${SER_SCHEMA.length}${missing.length ? " · missing " + esc(missing.join(", ")) : " · complete"}
        </div>`
      : "";

    const agTag = c.is_silver ? ` <span class="badge-ag${c.asw_oz == null ? " unk" : ""}">Ag</span>` : "";
    const auTag = c.is_gold ? ` <span class="badge-au">Au</span>` : "";
    const tokTag = c.kind === "token" ? ` <span class="badge-kind">Token</span>` : "";
    const title = [c.country, c.year, c.denom].filter(has).join(" · ") || c.label || c.scan;
    const primary = c.ser || c.scan;
    const secondary = [c.ser ? c.scan : c.kind, c.added ? "added " + c.added : ""].filter(has).join(" · ");
    const valueChips = `
      <div class="ds-chips">
        <span class="chip"><strong>${c.est != null ? money(c.est) : "—"}</strong> est${c.conf ? " · " + esc(c.conf) : ""}</span>
        ${c.is_silver ? `<span class="chip ag">Ag <strong>${c.asw_oz != null ? num(c.asw_oz, 4) + " oz" : "ASW ?"}</strong> · melt <strong>${meltLiveDisplay || "—"}</strong></span>` : ""}
        ${c.is_gold ? `<span class="chip au">Au <strong>${c.agw_oz != null ? num(c.agw_oz, 4) + " oz" : "AGW ?"}</strong></span>` : ""}
        ${c.face ? `<span class="chip">Face <strong>${esc(c.face)}</strong></span>` : ""}
      </div>`;

    const photos = isFlip || c.photo_target_obv
      ? `<div class="ds-photos">${photoSlot(c, "obv")}${photoSlot(c, "rev")}</div>
         <p class="ph-hint">${c.has_photo ? "Tap a photo for full size." : `Save photos as <code>${esc(c.photo_dir || "photos/{CONT}/{ISO}")}/</code> then publish; see <code>photos/README.md</code>.`}</p>`
      : "";

    $("#drawer-body").innerHTML = `
      <header class="ds-head">
        <div class="ds-ser">${esc(primary)}${agTag}${auTag}${tokTag}</div>
        <h2>${esc(title)}</h2>
        <div class="scan">${esc(secondary)}</div>
        ${valueChips}
        ${completeness}
      </header>
      <div class="ds-grid${photos ? "" : " no-photos"}">
        ${photos ? `<div class="ds-col-photos">${photos}</div>` : ""}
        <div class="ds-col-fields">
          ${section("Identity", identity)}
          ${section("Value", value)}
          ${section("Physical", physical)}
          ${section("Record", record)}
        </div>
      </div>
      ${c.notes ? `<section class="ds-sec"><h4>Notes</h4><div class="notes-box">${esc(c.notes)}</div></section>` : (isFlip ? `<section class="ds-sec"><h4>Notes</h4><div class="notes-box missing">—</div></section>` : "")}
    `;

    // Missing-on-this-host images (e.g. Drive single-file) fall back to the dashed slot.
    $$("#drawer-body .ph-slot.has img").forEach((img) => {
      img.addEventListener("error", () => {
        const fig = img.closest(".ph-slot");
        fig.classList.remove("has"); fig.classList.add("ph-blank");
        img.closest(".ph-open").remove();
        const fb = $(".ph-fallback", fig); if (fb) fb.hidden = false;
      }, { once: true });
    });
    $$("#drawer-body .ph-open").forEach((b) => b.addEventListener("click", () => openLightbox(c, b.dataset.side)));
    $$("#drawer-body .ph-file[data-copy]").forEach((el) => el.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(el.dataset.copy); showToast("Copied " + el.dataset.copy); }
      catch { showToast(el.dataset.copy); }
    }));

    // Prev / next position
    const list = isFlip ? dossierList() : [];
    const i = list.indexOf(scan);
    $("#dossier-pos").textContent = i >= 0 ? `${i + 1} / ${list.length}` : "";
    $("#dossier-prev").disabled = !(i > 0);
    $("#dossier-next").disabled = !(i >= 0 && i < list.length - 1);

    const wasHidden = $("#drawer").hidden;
    $("#drawer").hidden = false;
    $("#drawer-backdrop").hidden = false;
    document.body.classList.add("drawer-open");
    if (persist && wasHidden === false) $("#drawer-inner").scrollTop = 0;
    if (persist) saveState();
  }

  function dossierStep(delta) {
    if (!currentDrawerScan) return;
    const list = dossierList();
    const i = list.indexOf(currentDrawerScan);
    if (i < 0) return;
    const j = i + delta;
    if (j < 0 || j >= list.length) return;
    openDrawer(list[j]);
  }

  // Lightbox (obv ↔ rev)
  let lbCard = null;
  let lbSide = "obv";
  function openLightbox(c, side) {
    lbCard = c; lbSide = side;
    renderLightbox();
    $("#lightbox").hidden = false;
  }
  function renderLightbox() {
    if (!lbCard) return;
    const src = lbSide === "obv" ? lbCard.photo_obv : lbCard.photo_rev;
    const other = lbSide === "obv" ? lbCard.photo_rev : lbCard.photo_obv;
    $("#lb-img").src = src || "";
    $("#lb-img").alt = `${lbCard.ser || lbCard.scan} ${lbSide}`;
    $("#lb-cap").textContent = `${lbCard.ser || lbCard.scan} · ${lbSide === "obv" ? "Obverse" : "Reverse"} · ${[lbCard.country, lbCard.year, lbCard.denom].filter(has).join(" · ")}`;
    $("#lb-prev").hidden = !other; $("#lb-next").hidden = !other;
  }
  function flipLightbox() {
    if (!lbCard) return;
    const next = lbSide === "obv" ? "rev" : "obv";
    if ((next === "obv" ? lbCard.photo_obv : lbCard.photo_rev)) { lbSide = next; renderLightbox(); }
  }
  function closeLightbox() {
    $("#lightbox").hidden = true;
    $("#lb-img").removeAttribute("src");
    lbCard = null;
  }

  function closeDrawer() {
    currentDrawerScan = null;
    document.body.classList.remove("drawer-open");
    $("#drawer").hidden = true;
    $("#drawer-backdrop").hidden = true;
    saveState();
  }

  // Tabs
  $$(".tab").forEach((btn) => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-backdrop").addEventListener("click", closeDrawer);
  $("#dossier-prev").addEventListener("click", () => dossierStep(-1));
  $("#dossier-next").addEventListener("click", () => dossierStep(1));
  $("#lb-close").addEventListener("click", closeLightbox);
  $("#lb-prev").addEventListener("click", (e) => { e.stopPropagation(); flipLightbox(); });
  $("#lb-next").addEventListener("click", (e) => { e.stopPropagation(); flipLightbox(); });
  $("#lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    const typing = ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName);
    if (!$("#lightbox").hidden) {
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") flipLightbox();
      return;
    }
    if (e.key === "Escape") closeDrawer();
    else if (!typing && currentDrawerScan && e.key === "ArrowLeft") dossierStep(-1);
    else if (!typing && currentDrawerScan && e.key === "ArrowRight") dossierStep(1);
  });
  // Swipe left/right in the dossier on phones
  (() => {
    let x0 = null, y0 = null;
    const el = $("#drawer-inner");
    el.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    el.addEventListener("touchend", (e) => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) dossierStep(dx < 0 ? 1 : -1);
      x0 = y0 = null;
    }, { passive: true });
  })();
  // Phone came back to the foreground: check for a new publish right away.
  document.addEventListener("visibilitychange", () => {
    if (isHttp && !document.hidden && autoRefresh && $("#vault-data")) checkWebVersion();
  });

  const drawerInner = $("#drawer-inner");
  if (drawerInner) {
    drawerInner.addEventListener("scroll", () => {
      drawerScrollPauseUntil = Date.now() + 6000;
    }, { passive: true });
  }

  $("#btn-refresh").addEventListener("click", () => {
    if ($("#vault-data")) bustReload();
    else { saveState(); loadVault(); }
  });

  const autoBox = $("#auto-refresh");
  if (autoBox) {
    try {
      const saved = localStorage.getItem(AUTO_KEY);
      if (saved != null) {
        autoRefresh = saved === "1";
        autoBox.checked = autoRefresh;
      }
    } catch { /* ignore */ }
    autoBox.addEventListener("change", () => {
      autoRefresh = autoBox.checked;
      try { localStorage.setItem(AUTO_KEY, autoRefresh ? "1" : "0"); } catch { /* ignore */ }
      saveState();
      updateLiveStatus();
    });
  }

  window.addEventListener("beforeunload", saveState);
  window.addEventListener("hashchange", applyHashTab);

  loadVault();
  scheduleReload();
})();

</script>
</body>
</html>
